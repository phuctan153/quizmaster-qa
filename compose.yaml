name: quizmaster-qa
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: quizmaster
      POSTGRES_USER: quizmaster
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizmaster -d quizmaster"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
